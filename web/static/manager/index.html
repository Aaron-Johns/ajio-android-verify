<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner proof desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232d3edb%27/%3E%3Crect x=%277%27 y=%278%27 width=%2718%27 height=%2712%27 fill=%27%23fff%27/%3E%3Crect x=%277%27 y=%2723%27 width=%2718%27 height=%273%27 fill=%27%231f7a5c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Navigation and recent runs">
    <div class="brand">
      <h1>Banner proof desk</h1>
      <p>Does each banner lead where it says it does?</p>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#/runs" id="nav-runs">Runs</a>
      <a href="#/schedules" id="nav-schedules">Schedules <span class="badge" id="nav-badge" hidden></span></a>
    </nav>
    <button class="new-check" id="new-check" type="button">Start a check</button>
    <div class="runs" id="runs" aria-label="Recent runs"></div>
    <div class="rail-foot">
      <button class="tile" id="theme-toggle" type="button" title="Switch between the light and the dark look">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span>Switch theme</span></button>
      <button class="tile" id="clear-cache" type="button" title="Forget every saved verdict so the next checks do every banner fresh, for example after a matching rule changed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.5h9.2L17.5 7M10 11v5M14 11v5"/></svg><span>Clear cache</span></button>
      <a class="tile" id="link-classic" href="/" title="The original view of the same data">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 10h17M9 10v9"/></svg><span>Classic view</span></a>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar"><button class="ghost" id="rail-toggle" type="button">Menu</button></div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Banner detail" data-open="false"></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form class="dlg" id="dlg-form" method="dialog">
    <div class="dlg-head">
      <h2>Start a check</h2>
      <button class="x" type="button" id="dlg-close" aria-label="Close">&times;</button>
    </div>
    <p class="sub">Reads each page's banners from AJIO, then checks every one against the listing it opens.</p>
    <div id="dlg-axes"></div>
    <div class="row3">
      <label>Scope <select id="d-scope"></select></label>
      <label>Number of banners <input id="d-limit" type="number" min="1" placeholder="All"></label>
      <label>Banners at a time <input id="d-workers" type="number" min="1" value="3"></label>
    </div>
    <fieldset class="carfs">
      <legend>Carousels</legend>
      <div class="row-inline">
        <button class="ghost" type="button" id="d-load-car">Load carousels to choose which to run</button>
        <span class="hint" id="d-car-hint">Every carousel in scope is checked unless you load the list and untick some.</span>
      </div>
      <div id="d-cars"></div>
    </fieldset>
    <div class="dlg-foot">
      <span class="msg" id="d-msg"></span>
      <button class="ghost" type="button" id="d-repeat" title="Carry these choices into a new schedule">Repeat automatically</button>
      <button class="primary" type="submit" id="d-go">Start check</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
