<!doctype html>
<html lang="en">

<title>AJIO Feed Verify · Manager view</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='%23000' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M9 24 16 7l7 17M11.6 18.5h8.8' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='square' stroke-linejoin='miter'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f9; --surface: #ffffff; --surface-2: #f1f3f7; --surface-3: #e9ecf2;
    --line: #e5e8ee; --line-strong: #d3d8e1;
    --ink: #101828; --ink-2: #475467; --ink-3: #8792a5;
    --brand: #4f46e5; --brand-strong: #4338ca; --brand-soft: #eef0ff; --on-brand: #ffffff;
    --side: #0f172a; --side-2: #1b2438; --side-ink: #cbd5e1; --side-dim: #7b88a1;
    --pass: #12a150; --pass-soft: #e7f7ee; --pass-ink: #0b7a3b;
    --fail: #e03a3a; --fail-soft: #fdecec; --fail-ink: #b42323;
    --warn: #e08a00; --warn-soft: #fff3dc; --warn-ink: #9a5b00;
    --proc: #7c4dff; --proc-soft: #f0eaff; --proc-ink: #5b34d6;
    --pend: #8792a5; --pend-soft: #eef0f4; --pend-ink: #566072;
    --skip: #0b8ad9; --skip-soft: #e4f3fc; --skip-ink: #0a6aa8;
    --unav: #7b8794; --unav-soft: #eceff3; --unav-ink: #3e4c59;
    --shadow-1: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-2: 0 10px 30px rgba(16,24,40,.12);
    --r: 14px; --r-sm: 9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1019; --surface: #131927; --surface-2: #1a2132; --surface-3: #232c41;
      --line: #232c3f; --line-strong: #2f3a52;
      --ink: #eef1f6; --ink-2: #a5afc2; --ink-3: #6f7b93;
      --brand: #8b93ff; --brand-strong: #a3a9ff; --brand-soft: rgba(139,147,255,.14); --on-brand: #0c1019;
      --side: #080b13; --side-2: #131a2a; --side-ink: #c6cfe0; --side-dim: #66738c;
      --pass: #3ddc84; --pass-soft: rgba(61,220,132,.13); --pass-ink: #7ce8a9;
      --fail: #ff6b6b; --fail-soft: rgba(255,107,107,.14); --fail-ink: #ff9d9d;
      --warn: #ffb020; --warn-soft: rgba(255,176,32,.14); --warn-ink: #ffcc66;
      --proc: #a78bfa; --proc-soft: rgba(167,139,250,.16); --proc-ink: #c6b5ff;
      --pend: #6f7b93; --pend-soft: rgba(111,123,147,.16); --pend-ink: #b4bdd0;
      --skip: #4db2f5; --skip-soft: rgba(77,178,245,.14); --skip-ink: #93d3fb;
      --unav: #8a96a3; --unav-soft: rgba(138,150,163,.16); --unav-ink: #c5ccd3;
      --shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --shadow-2: 0 14px 36px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1019; --surface: #131927; --surface-2: #1a2132; --surface-3: #232c41;
    --line: #232c3f; --line-strong: #2f3a52;
    --ink: #eef1f6; --ink-2: #a5afc2; --ink-3: #6f7b93;
    --brand: #8b93ff; --brand-strong: #a3a9ff; --brand-soft: rgba(139,147,255,.14); --on-brand: #0c1019;
    --side: #080b13; --side-2: #131a2a; --side-ink: #c6cfe0; --side-dim: #66738c;
    --pass: #3ddc84; --pass-soft: rgba(61,220,132,.13); --pass-ink: #7ce8a9;
    --fail: #ff6b6b; --fail-soft: rgba(255,107,107,.14); --fail-ink: #ff9d9d;
    --warn: #ffb020; --warn-soft: rgba(255,176,32,.14); --warn-ink: #ffcc66;
    --proc: #a78bfa; --proc-soft: rgba(167,139,250,.16); --proc-ink: #c6b5ff;
    --pend: #6f7b93; --pend-soft: rgba(111,123,147,.16); --pend-ink: #b4bdd0;
    --skip: #4db2f5; --skip-soft: rgba(77,178,245,.14); --skip-ink: #93d3fb;
    --unav: #8a96a3; --unav-soft: rgba(138,150,163,.16); --unav-ink: #c5ccd3;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 14px 36px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  .ic { width: 18px; height: 18px; flex: none; }
  .ic.sm { width: 15px; height: 15px; }
  .muted { color: var(--ink-3); }
  .dim { color: var(--ink-2); }
  .nowrap { white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .side {
    background: var(--side); color: var(--side-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
  .brand-mark {
    width: 34px; height: 34px; display: grid; place-items: center; flex: none; background: #000; color: #fff;
    border: 2px solid #fff; border-radius: 3px; font-weight: 800; font-size: 18px; line-height: 1;
  }
  .logo b { display: block; color: #fff; font-size: 14.5px; letter-spacing: .01em; line-height: 1.2; }
  .logo span { font-size: 11.5px; color: var(--side-dim); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; color: var(--side-ink);
    font-weight: 500; text-decoration: none; transition: background .12s, color .12s;
  }
  .nav a:hover { background: var(--side-2); color: #fff; }
  .nav a.on { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
  .nav .badge {
    margin-left: auto; min-width: 20px; padding: 0 6px; text-align: center; font-size: 11px; font-weight: 700; line-height: 19px;
    border-radius: 999px; background: #ef4444; color: #fff;
  }
  .nav .badge.soft { background: rgba(255,255,255,.12); color: #e2e8f0; }
  .side-spacer { flex: 1; }
  .side-foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 12px; }
  .side-foot button, .side-foot a {
    display: flex; align-items: center; gap: 11px; padding: 8px 11px; border-radius: 10px; background: none; border: 0;
    color: var(--side-dim); cursor: pointer; text-align: left; font-size: 13px; text-decoration: none;
  }
  .side-foot button:hover, .side-foot a:hover { background: var(--side-2); color: #fff; text-decoration: none; }
  .content { padding: 28px 36px 60px; min-width: 0; max-width: 1480px; width: 100%; margin: 0 auto; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; gap: 4px; }
    .logo { padding: 0 8px 0 2px; } .logo span { display: none; }
    .nav { flex-direction: row; } .nav a { padding: 8px 10px; white-space: nowrap; }
    .side-spacer { display: none; } .side-foot { flex-direction: row; border: 0; padding: 0; margin-left: auto; }
    .side-foot span.lbl { display: none; }
    .content { padding: 18px 16px 50px; }
    .side::-webkit-scrollbar { display: none; } .side { scrollbar-width: none; }
  }
  @media (max-width: 520px) {
    .drawer .df { flex-wrap: wrap; } .drawer .df .grow { display: none; } .drawer .df .btn.primary { flex: 1; } .drawer .df .btn.ghost { flex: 1 0 100%; justify-content: flex-start; }
  }
  @media (max-width: 640px) {
    .logo div { display: none; }
    .nav a { padding: 8px 10px; } .nav a > span:nth-child(2) { display: none; } .nav a.on > span:nth-child(2) { display: inline; }
    .page-head h1 { font-size: 22px; }
    .banners { grid-template-columns: 1fr; }
    .review-item { grid-template-columns: 72px minmax(0, 1fr); } .review-item .pill { display: none; } .review-item img { width: 72px; height: 44px; }
    .hs-card { grid-template-columns: 1fr; }
    .dl-row { grid-template-columns: 110px minmax(0, 1fr); }
    .toolbar .sel { flex: 1 1 140px; }
    .run-summary { grid-template-columns: minmax(0, 1fr); padding: 18px; } .run-summary > div:last-child { text-align: left !important; }
    .legend { gap: 6px; }
  }

  /* ---------- page head ---------- */
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); margin-bottom: 8px; flex-wrap: wrap; }
  .crumbs a { color: var(--ink-2); }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
  .page-head .sub { color: var(--ink-2); margin-top: 4px; font-size: 13.5px; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 550; font-size: 13.5px;
    cursor: pointer; transition: background .12s, border-color .12s, box-shadow .12s, transform .05s; white-space: nowrap;
    box-shadow: var(--shadow-1); text-decoration: none;
  }
  .btn:hover { background: var(--surface-2); text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 35%, transparent); }
  .btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .btn.danger { color: var(--fail-ink); }
  .btn.danger:hover { background: var(--fail-soft); border-color: var(--fail); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--surface-3); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; gap: 5px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; pointer-events: none; }
  .icon-btn {
    width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; border: 0; background: none;
    color: var(--ink-3); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-3); color: var(--ink); }

  /* ---------- cards / sections ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); }
  .card-pad { padding: 20px; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
  .card-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.005em; }
  .card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .card-body { padding: 14px 20px 18px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  @media (max-width: 1100px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
  .section-title { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0 0 10px; }
  .empty {
    text-align: center; color: var(--ink-2); padding: 38px 20px; border: 1.5px dashed var(--line-strong); border-radius: var(--r);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
  }
  .empty .big { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .empty.flat { border: 0; padding: 22px 12px; background: none; }

  /* ---------- status pills / bars ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: var(--pend-soft); color: var(--pend-ink);
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .pill.pass { background: var(--pass-soft); color: var(--pass-ink); }
  .pill.fail { background: var(--fail-soft); color: var(--fail-ink); }
  .pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .pill.proc { background: var(--proc-soft); color: var(--proc-ink); }
  .pill.proc::before { animation: blink 1.1s ease-in-out infinite; }
  .pill.skip { background: var(--skip-soft); color: var(--skip-ink); }
  .pill.pend { background: var(--pend-soft); color: var(--pend-ink); }
  .pill.unav { background: var(--unav-soft); color: var(--unav-ink); box-shadow: inset 0 0 0 1px var(--unav); }
  .pill.plain::before { display: none; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .seg { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
  .seg > i { display: block; height: 100%; min-width: 3px; }
  .seg .pass { background: var(--pass); } .seg .fail { background: var(--fail); } .seg .warn { background: var(--warn); }
  .seg .proc { background: var(--proc); } .seg .skip { background: var(--skip); } .seg .pend { background: var(--pend); opacity: .45; }
  .seg .unav { background: repeating-linear-gradient(135deg, var(--unav) 0 3px, transparent 3px 6px); }
  .seg.lg { height: 12px; }
  .seg .proc { animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 50% { opacity: .55; } }
  .tag {
    display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
    color: var(--ink-2); font-weight: 500; white-space: nowrap;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .tag.brand { background: var(--brand-soft); border-color: transparent; color: var(--brand-strong); }
  .num-warn { color: var(--fail-ink); font-weight: 650; }

  /* ---------- overview hero ---------- */
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: 26px 30px; position: relative; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .9;
    background: radial-gradient(600px 220px at 0% 0%, var(--hero-glow, var(--pass-soft)), transparent 70%);
  }
  .hero > * { position: relative; }
  .hero.warn { --hero-glow: var(--warn-soft); } .hero.fail { --hero-glow: var(--fail-soft); } .hero.pass { --hero-glow: var(--pass-soft); }
  .hero.idle { --hero-glow: var(--brand-soft); }
  .ring { width: 132px; height: 132px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 11; }
  .ring .track { stroke: var(--surface-3); }
  .ring .arc { stroke-linecap: round; transition: stroke-dasharray .6s ease; }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
  .ring .mid b { font-size: 30px; font-weight: 750; letter-spacing: -.03em; }
  .ring .mid span { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .hero h2 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .hero p { color: var(--ink-2); margin-top: 6px; max-width: 62ch; }
  .hero .hero-actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: start; padding: 20px; } }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 20px 0; }
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
  .kpi .k { font-size: 12.5px; color: var(--ink-3); font-weight: 550; display: flex; align-items: center; gap: 7px; }
  .kpi .v { font-size: 26px; font-weight: 720; letter-spacing: -.025em; line-height: 1.25; }
  .kpi .v.txt { font-size: 18px; letter-spacing: -.01em; padding: 4px 0; }
  .kpi .n { font-size: 12.5px; color: var(--ink-3); }
  .kpi .dotk { width: 8px; height: 8px; border-radius: 50%; background: var(--pend); }
  .kpi .dotk.pass { background: var(--pass); } .kpi .dotk.fail { background: var(--fail); } .kpi .dotk.warn { background: var(--warn); }
  .kpi .dotk.brand { background: var(--brand); }

  /* ---------- tables / lists ---------- */
  table.t { width: 100%; border-collapse: collapse; }
  table.t th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650;
    padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
  }
  table.t td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t tbody tr.row-link { cursor: pointer; transition: background .1s; }
  table.t tbody tr.row-link:hover { background: var(--surface-2); }
  .tbl-wrap { overflow-x: auto; }
  .cell-main { font-weight: 600; }
  .cell-sub { font-size: 12.5px; color: var(--ink-3); }
  .mini { min-width: 130px; }
  .mini .seg { margin-bottom: 4px; }
  .mini .lab { font-size: 12px; color: var(--ink-2); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab {
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
    font-size: 13px; font-weight: 550; color: var(--ink-2);
  }
  .tab:hover { border-color: var(--brand); color: var(--ink); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .tab .c { opacity: .65; margin-left: 5px; font-weight: 500; }

  /* review list (banners that need a look) */
  .review-item { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; padding: 12px 20px; align-items: center; border-top: 1px solid var(--line); cursor: pointer; }
  .review-item:first-child { border-top: 0; }
  .review-item:hover { background: var(--surface-2); }
  .review-item img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: var(--surface-3); display: block; }
  .review-item .ttl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .review-item .why { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .review-item .feed { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

  .side-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); cursor: pointer; }
  .side-item:first-child { border-top: 0; }
  .side-item:hover { background: var(--surface-2); }
  .side-item .grow { flex: 1; min-width: 0; }
  .side-item .ttl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .health-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pend); flex: none; }
  .health-dot.pass { background: var(--pass); } .health-dot.fail { background: var(--fail); } .health-dot.warn { background: var(--warn); }
  .health-dot.proc { background: var(--proc); animation: blink 1.1s infinite; }

  .live-strip { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-color: color-mix(in srgb, var(--proc) 35%, var(--line)); background: linear-gradient(90deg, var(--proc-soft), var(--surface) 65%); margin-bottom: 20px; cursor: pointer; }
  .live-strip .grow { flex: 1; min-width: 0; }

  /* ---------- run detail ---------- */
  .run-summary { padding: 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
  .run-summary .big { font-size: 15px; font-weight: 650; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .lg-chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; border: 1.5px solid transparent;
    background: var(--surface-2); cursor: pointer; font-size: 13px; font-weight: 550; transition: border-color .1s, background .1s;
  }
  .lg-chip .sw { width: 9px; height: 9px; border-radius: 50%; }
  .lg-chip b { font-weight: 700; }
  .lg-chip:hover { background: var(--surface-3); }

  .diff-note { margin-top: 12px; padding: 9px 13px; border-radius: 10px; background: var(--surface-2); font-size: 13px; display: flex; gap: 8px; align-items: center; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0 16px; }

  select.sel, .input {
    padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px; min-width: 0;
  }

  .banners { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 18px; }
  .bcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; box-shadow: var(--shadow-1); transition: transform .12s, box-shadow .15s, border-color .15s; }

  .bcard .status-pill { position: absolute; left: 10px; top: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); background-color: var(--surface); }
  .bcard .status-pill.pass { background-image: linear-gradient(var(--pass-soft), var(--pass-soft)); }
  .bcard .status-pill.fail { background-image: linear-gradient(var(--fail-soft), var(--fail-soft)); }
  .bcard .status-pill.warn { background-image: linear-gradient(var(--warn-soft), var(--warn-soft)); }
  .bcard .status-pill.proc { background-image: linear-gradient(var(--proc-soft), var(--proc-soft)); }
  .bcard .status-pill.skip { background-image: linear-gradient(var(--skip-soft), var(--skip-soft)); }
  .bcard .status-pill.unav { background-image: linear-gradient(var(--unav-soft), var(--unav-soft)); }
  .bcard .flags { position: absolute; right: 10px; top: 10px; display: flex; gap: 5px; }
  .bcard .flags span { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(15,23,42,.78); color: #fff; letter-spacing: .04em; }
  .bcard .activity { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--proc-ink); box-shadow: 0 2px 8px rgba(0,0,0,.22); }
  .bcard .activity i { width: 7px; height: 7px; border-radius: 50%; background: var(--proc); animation: blink 1s infinite; }
  .bcard .bar { height: 3px; background: var(--pend); }
  .bcard.s-PASS .bar { background: var(--pass); } .bcard.s-FAIL .bar { background: var(--fail); } .bcard.s-INCONCLUSIVE .bar { background: var(--warn); }
  .bcard.s-PROCESSING .bar { background: var(--proc); } .bcard.s-SKIPPED .bar { background: var(--skip); } .bcard.s-UNAVAILABLE .bar { background: var(--unav); }
  .bcard.s-PROCESSING { box-shadow: 0 0 0 2px color-mix(in srgb, var(--proc) 45%, transparent), var(--shadow-1); }
  .bcard .bd { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .bcard .where { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .bcard .alt { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bcard .why { font-size: 12.5px; padding: 8px 10px; border-radius: 9px; background: var(--fail-soft); color: var(--fail-ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bcard.s-INCONCLUSIVE .why { background: var(--warn-soft); color: var(--warn-ink); }
  .bcard.s-UNAVAILABLE .why { background: var(--unav-soft); color: var(--unav-ink); }
  .bcard .foot { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 4px; }
  .bcard .link { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .bcard.skip-req { opacity: .55; filter: grayscale(.8); }
  .hidden-note { font-size: 12.5px; color: var(--ink-3); margin: 0 0 14px; }

  /* ---------- schedules ---------- */
  .sched-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .scard { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .12s, box-shadow .15s; position: relative; overflow: hidden; }
  .scard:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
  .scard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pend); }
  .scard.pass::before { background: var(--pass); } .scard.fail::before { background: var(--fail); } .scard.warn::before { background: var(--warn); } .scard.proc::before { background: var(--proc); }
  .scard .nm { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }

  .scard .acts { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
  .fire { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 22px 0 10px; font-size: 13px; }
  .fire b { font-size: 14px; }
  .fire .line { flex: 1; height: 1px; background: var(--line); min-width: 30px; }
  .run-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .rtile { padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; transition: transform .12s, box-shadow .15s; }
  .rtile:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
  .rtile .h { display: flex; align-items: center; gap: 8px; }
  .rtile .h .grow { flex: 1; font-weight: 650; }
  details.fold { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-top: 20px; box-shadow: var(--shadow-1); }
  details.fold > summary { cursor: pointer; padding: 15px 20px; font-weight: 650; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; }
  details.fold[open] > summary::after { transform: rotate(-135deg); }
  details.fold > .fold-body { padding: 0 20px 18px; }

  /* ---------- alerts ---------- */
  .alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 15px 20px; border-top: 1px solid var(--line); align-items: start; }
  .alert:first-child { border-top: 0; }
  .alert .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--fail-soft); color: var(--fail-ink); }
  .alert.test .ico { background: var(--skip-soft); color: var(--skip-ink); }
  .alert.read { opacity: .68; } .alert.read .ico { background: var(--pend-soft); color: var(--pend-ink); }
  .alert .t { font-weight: 620; }
  .alert pre { margin: 6px 0 0; white-space: pre-wrap; font: inherit; font-size: 13px; color: var(--ink-2); }
  .alert .meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .alert .row-acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); display: inline-block; margin-right: 8px; }

  /* ---------- forms ---------- */
  .form-card { padding: 4px 0; }
  .fsec { padding: 22px 26px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; }
  .fsec:first-child { border-top: 0; }
  .fsec h3 { font-size: 14.5px; font-weight: 650; }
  .fsec .desc { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  .fields { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .field label.lb, .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .field .hint, .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
  .field .input, .field select.sel { width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .start-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .start-row .input { width: auto; }
  .field .start-row .input, .field .start-row select.sel { width: auto; }
  .start-row input[type=text], .field .start-row input[type=text] { width: 58px; text-align: center; }
  .field .start-row input[type=number] { width: 90px; }
  .form-foot { padding: 16px 26px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; background: color-mix(in srgb, var(--surface-2) 50%, var(--surface)); border-radius: 0 0 var(--r) var(--r); flex-wrap: wrap; }
  @media (max-width: 900px) { .fsec { grid-template-columns: 1fr; gap: 14px; padding: 18px; } }
  .checkline { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .checkline input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand); }
  .checkline b { font-weight: 600; display: block; } .checkline span { color: var(--ink-3); font-size: 12.5px; }

  /* multi-select controls */
  .tgl-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .tgl { padding: 7px 15px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 550; color: var(--ink-2); transition: all .1s; }
  .tgl:hover { border-color: var(--brand); color: var(--ink); }
  .tgl.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .ms { position: relative; }
  .ms-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 13.5px; }
  .ms-btn .dimt { color: var(--ink-3); }
  .ms-pop { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-2); padding: 10px; }
  .ms-pop[hidden] { display: none; }
  .ms-pop .input { width: 100%; }
  .ms-list { max-height: 230px; overflow-y: auto; margin: 8px 0; }
  .ms-opt { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .ms-opt:hover, .ms-opt.active { background: var(--surface-2); }
  .ms-opt .ck { width: 17px; height: 17px; border: 1.5px solid var(--line-strong); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; flex: none; }
  .ms-opt.sel .ck { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .ms-empty { padding: 10px 8px; color: var(--ink-3); font-size: 13px; }
  .ms-foot { display: flex; align-items: center; gap: 8px; }

  .chip-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .x-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-soft); color: var(--brand-strong); border-radius: 999px; padding: 3px 5px 3px 11px; font-size: 12.5px; font-weight: 550; }
  .x-chip button { border: 0; background: none; cursor: pointer; color: inherit; font-size: 16px; line-height: 1; padding: 0 5px; opacity: .7; }
  .x-chip button:hover { opacity: 1; }
  .tag-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; cursor: text; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
  .tag-input:focus-within { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  .tag-input input { flex: 1 1 140px; min-width: 120px; border: 0; background: transparent; padding: 4px 2px; outline: none; font: inherit; font-size: 13.5px; color: var(--ink); }
  .pin-msg { color: var(--fail-ink) !important; }
  .combo-hint { font-size: 13px; padding: 9px 12px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-strong); }
  .combo-hint:empty { display: none; }
  .combo-hint.over { background: var(--fail-soft); color: var(--fail-ink); font-weight: 600; }

  .car-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; max-height: 340px; overflow-y: auto; }
  .car-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .car-row:first-child { border-top: 0; }
  .car-row:hover { background: var(--surface-2); }
  .car-row img { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; background: var(--surface-3); }
  .car-row input { accent-color: var(--brand); width: 16px; height: 16px; }
  .car-row .n { margin-left: auto; color: var(--ink-3); white-space: nowrap; }

  /* ---------- drawers / sheets / dialogs ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(9,12,22,.55); backdrop-filter: blur(2px); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .18s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 90; transform: translateX(102%); transition: transform .22s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: var(--shadow-2); }
  .drawer.open { transform: none; }
  .drawer .dh { padding: 20px 24px 14px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line); }
  .drawer .dh h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
  .drawer .dh p { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
  .drawer .dh .icon-btn { margin-left: auto; }
  .drawer .db { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
  .drawer .df { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
  .drawer .df .grow { flex: 1; }
  details.adv > summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink-2); padding: 4px 0; }
  details.adv[open] > summary { margin-bottom: 12px; }

  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(1040px, 100%); background: var(--bg); z-index: 90; transform: translateX(102%); transition: transform .22s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: var(--shadow-2); }
  .sheet.open { transform: none; }
  .sheet .sh { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .sheet .sh .grow { flex: 1; min-width: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .sb { overflow-y: auto; flex: 1; padding: 22px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; align-content: start; }
  @media (max-width: 860px) { .sheet .sb { grid-template-columns: 1fr; } }
  .sheet .imgbox { position: sticky; top: 0; align-self: start; }
  .sheet .imgbox img { width: 100%; border-radius: var(--r); display: block; box-shadow: var(--shadow-1); background: var(--surface-3); }
  .verdict { padding: 16px 18px; border-radius: var(--r); display: flex; gap: 14px; align-items: flex-start; background: var(--pend-soft); }
  .verdict.pass { background: var(--pass-soft); } .verdict.fail { background: var(--fail-soft); } .verdict.warn { background: var(--warn-soft); } .verdict.proc { background: var(--proc-soft); } .verdict.skip { background: var(--skip-soft); } .verdict.unav { background: var(--unav-soft); }
  .verdict .vi { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--pend); color: #fff; flex: none; }
  .verdict.pass .vi { background: var(--pass); } .verdict.fail .vi { background: var(--fail); } .verdict.warn .vi { background: var(--warn); } .verdict.proc .vi { background: var(--proc); } .verdict.skip .vi { background: var(--skip); } .verdict.unav .vi { background: var(--unav); }
  .verdict b { font-size: 16px; display: block; }

  .dl-card { padding: 4px 18px; margin-top: 14px; }
  .dl-row { display: grid; grid-template-columns: 138px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .dl-row:first-child { border-top: 0; }
  .dl-row .k { color: var(--ink-3); } .dl-row .v { min-width: 0; overflow-wrap: anywhere; }
  .dl-row .v.bad { color: var(--fail-ink); font-weight: 600; } .dl-row .v.good { color: var(--pass-ink); font-weight: 600; }
  .hs-card { padding: 14px; margin-top: 14px; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; }
  .hs-card img { width: 100%; border-radius: 8px; background: var(--surface-3); display: block; }
  .hs-card .hh { display: flex; align-items: center; gap: 8px; font-weight: 650; margin-bottom: 4px; }
  .hs-card p { font-size: 13px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .hs-card { grid-template-columns: 1fr; } }

  .dialog { position: fixed; inset: 0; z-index: 120; display: none; place-items: center; padding: 20px; }
  .dialog.open { display: grid; }
  .dialog .box { background: var(--surface); border-radius: 16px; padding: 24px; width: min(420px, 100%); box-shadow: var(--shadow-2); }
  .dialog h3 { font-size: 17px; font-weight: 700; }
  .dialog p { color: var(--ink-2); margin-top: 8px; }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
  .toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; max-width: 400px; box-shadow: var(--shadow-2); display: flex; gap: 10px; align-items: flex-start; animation: rise .2s ease; }

  .skeleton { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
</style>

<script>
"use strict";
// ============================================================================================
// AJIO Feed Verify — manager view. Same server, same API, different face: it answers "is everything

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.text()) || res.statusText);
  return res.status === 204 ? null : res.json();
}

  return e.message;
}

// ---------- time ----------
function fmtTime(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return iso; } }
function fmtWhen(iso) {
  if (!iso) return "";
  try { return new Date(iso).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }); }
  catch (e) { return iso; }
}
function ago(iso) {
  const t = iso ? new Date(iso).getTime() : NaN;
  if (isNaN(t)) return "";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 7 * 86400) return `${Math.round(s / 86400)} d ago`;
  return new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function inTime(iso) {
  const t = iso ? new Date(iso).getTime() : NaN;
  if (isNaN(t)) return "";
  const s = Math.round((t - Date.now()) / 1000);
  if (s <= 60) return "any moment";
  if (s < 3600) return `in ${Math.round(s / 60)} min`;
  if (s < 86400) return `in ${Math.round(s / 3600)} h`;
  return `in ${Math.round(s / 86400)} d`;
}
function fmtInterval(min) { return min % 1440 === 0 ? `${min / 1440} day${min / 1440 === 1 ? "" : "s"}` : min % 60 === 0 ? `${min / 60} hour${min / 60 === 1 ? "" : "s"}` : `${min} min`; }
function intervalParts(min) { return min % 1440 === 0 ? { n: min / 1440, unit: 1440 } : min % 60 === 0 ? { n: min / 60, unit: 60 } : { n: min, unit: 1 }; }
function fmtDuration(secs) { return secs >= 3600 ? `${Math.floor(secs / 3600)}h ${Math.round(secs % 3600 / 60)}m` : secs >= 60 ? `${Math.round(secs / 60)} min` : `${secs}s`; }
const pad2 = n => String(n).padStart(2, "0");

// ---------- status vocabulary ----------
const ST = {
  PASS: { label: "Passed", cls: "pass" }, FAIL: { label: "Failed", cls: "fail" }, INCONCLUSIVE: { label: "Inconclusive", cls: "warn" },
  PROCESSING: { label: "Checking", cls: "proc" }, PENDING: { label: "Queued", cls: "pend" }, SKIPPED: { label: "Skipped", cls: "skip" },
  UNAVAILABLE: { label: "Couldn't check", cls: "unav" },   // AJIO / the network didn't answer: not a banner problem, not counted as needing review
};
const ORDER = ["PASS", "FAIL", "INCONCLUSIVE", "UNAVAILABLE", "PROCESSING", "PENDING", "SKIPPED"];
const stCls = k => (ST[k] || { cls: "pend" }).cls;
const stLabel = k => (ST[k] || { label: k }).label;
const needsReview = c => ((c || {}).FAIL || 0) + ((c || {}).INCONCLUSIVE || 0);
const totalOf = c => Object.values(c || {}).reduce((a, b) => a + b, 0);
const RUN_ST = {
  running: ["Running", "proc"], done: ["Complete", "pass"], failed: ["Didn't finish", "fail"], cancelled: ["Cancelled", "pend"],
  skipped: ["Skipped", "warn"], error: ["Error", "fail"],
};
function runPill(status) { const [l, c] = RUN_ST[status] || [status, "pend"]; return `<span class="pill ${c}">${esc(l)}</span>`; }
function runHealth(r) {
  const c = r.counts || {};
  if (r.status === "running") return "proc";
  if (r.status === "failed" || r.status === "error") return "fail";
  if (r.status === "cancelled" || r.status === "skipped") return "pend";
  return (c.FAIL ? "fail" : c.INCONCLUSIVE ? "warn" : "pass");
}
function segBar(counts, cls = "") {
  const total = totalOf(counts);
  if (!total) return `<div class="seg ${cls}"></div>`;
  return `<div class="seg ${cls}" role="img" aria-label="${esc(ORDER.filter(k => counts[k]).map(k => `${counts[k]} ${stLabel(k).toLowerCase()}`).join(", "))}">${
    ORDER.filter(k => counts[k]).map(k => `<i class="${stCls(k)}" style="flex:${counts[k]}" title="${counts[k]} ${stLabel(k).toLowerCase()}"></i>`).join("")}</div>`;
}
function runLine(r) {
  const c = r.counts || {}, n = needsReview(c), t = totalOf(c);
  if (r.status === "running") return `${t ? c.PASS || 0 : 0} passed so far`;
  if (["cancelled", "failed", "error"].includes(r.status)) {       // banners it never reached read as Inconclusive - not something to review
    const judged = (c.PASS || 0) + (c.FAIL || 0);
    return `<span class="dim">Stopped early · ${judged} judged</span>${c.FAIL ? ` · <span class="num-warn">${c.FAIL} failed</span>` : ""}`;
  }
  if (!t) return "No results";
  const u = c.UNAVAILABLE ? ` <span class="muted">· ${c.UNAVAILABLE} couldn't be checked</span>` : "";
  return (n ? `<span class="num-warn">${n} need${n === 1 ? "s" : ""} a look</span>` : "All clear") + u;
}

function toast(text, bad = false, ms = 6000) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = text;
  byId("toasts").appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function confirmDialog({ title, text, ok = "Confirm", danger = false }) {
  return new Promise(resolve => {
    const d = byId("dialog");
    byId("dialog-box").innerHTML = `<h3>${esc(title)}</h3><p>${esc(text || "")}</p>
      <div class="acts"><button class="btn" data-a="no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-a="yes">${esc(ok)}</button></div>`;
    d.classList.add("open");
    const done = v => { d.classList.remove("open"); d.onclick = null; document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = e => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", onKey);
    d.onclick = e => { const a = e.target.closest("[data-a]"); if (a) done(a.dataset.a === "yes"); else if (e.target === d) done(false); };
    $("[data-a=yes]", d).focus();
  });
}
function pageHead({ crumbs = [], title, sub = "", actions = "" }) {
  return `${crumbs.length ? `<div class="crumbs">${crumbs.map((c, i) => c.href ? `<a href="${c.href}">${esc(c.label)}</a>` : `<span>${esc(c.label)}</span>`).join(" <span>/</span> ")}</div>` : ""}
    <div class="page-head"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div class="head-actions">${actions}</div></div>`;
}

const feedLabel = r => `${esc(r.l1)} / ${esc(r.l2)}`;
const placeLabel = r => `${esc(r.state)} · ${esc(r.pincode)}`;
const schedName = id => { const s = scheds.find(x => x.id === id); return s ? s.name : null; };
function linkHtml(url) { return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>` : ""; }
function shortLink(url) { try { const u = new URL(url); return u.host.replace(/^www\./, "") + u.pathname; } catch (e) { return url || ""; } }

function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }

  const next = cur === "dark" ? "light" : "dark";

// Multi-select controls (l1 / l2 buttons, state dropdown with checkmarks, pincode chips)
// ============================================================================================
function makeToggleGroup(root, options, selected, onChange) {
  let chosen = [];
  root.className = "tgl-group";
  root.innerHTML = options.map(o => `<button type="button" class="tgl" data-v="${esc(o)}">${esc(o)}</button>`).join("");
  const buttons = $$(".tgl", root);
  const paint = () => buttons.forEach(b => { const on = chosen.includes(b.dataset.v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  function set(list) { chosen = options.filter(o => list.includes(o)); if (!chosen.length && options.length) chosen = [options[0]]; paint(); }
  root.addEventListener("click", ev => {
    const b = ev.target.closest(".tgl"); if (!b) return;
    const v = b.dataset.v;
    if (chosen.includes(v)) { if (chosen.length === 1) return; chosen = chosen.filter(x => x !== v); }
    else chosen = options.filter(o => o === v || chosen.includes(o));
    paint(); if (onChange) onChange();
  });
  set(selected);
  return { get: () => chosen.slice(), set };
}

const openPickers = new Set();
document.addEventListener("mousedown", ev => { for (const p of [...openPickers]) if (!p.root.contains(ev.target)) p.close(); });

function makeStatePicker(root, options, selected, onChange, defaultValue) {
  let chosen = [], query = "", active = 0;
  root.className = "ms";
  root.innerHTML = `
    <button type="button" class="ms-btn" aria-haspopup="listbox" aria-expanded="false"><span class="ms-label"></span><span class="muted">&#9662;</span></button>
    <div class="ms-pop" hidden>
      <input type="text" class="input ms-search" placeholder="Search states…" autocomplete="off" aria-label="Search states">
      <div class="ms-list" role="listbox" aria-multiselectable="true"></div>
      <div class="ms-foot"><span class="ms-count"></span><button type="button" class="btn sm ms-clear">Clear</button><button type="button" class="btn sm primary ms-done">Done</button></div>
    </div>
    <div class="chip-list ms-chips"></div>`;
  const btn = $(".ms-btn", root), pop = $(".ms-pop", root), search = $(".ms-search", root), list = $(".ms-list", root), chips = $(".ms-chips", root);
  const self = { root, close };
  const visible = () => options.filter(o => o.toLowerCase().includes(query));
  function paint() {
    $(".ms-label", root).innerHTML = chosen.length === 0 ? `<span class="dimt">Select states (blank = ${esc(defaultValue)})</span>` : chosen.length === 1 ? esc(chosen[0]) : `${chosen.length} states selected`;
    chips.innerHTML = chosen.map(v => `<span class="x-chip">${esc(v)}<button type="button" data-remove="${esc(v)}" title="Remove">&times;</button></span>`).join("");
    $(".ms-count", root).textContent = `${chosen.length} selected`;
    const rows = visible();
    if (active >= rows.length) active = Math.max(0, rows.length - 1);
    list.innerHTML = rows.length ? rows.map((o, i) => `<div class="ms-opt${chosen.includes(o) ? " sel" : ""}${i === active ? " active" : ""}" role="option" aria-selected="${chosen.includes(o)}" data-v="${esc(o)}"><span class="ck">&#10003;</span><span>${esc(o)}</span></div>`).join("") : '<div class="ms-empty">No state matches.</div>';
  }
  function toggle(v) { chosen = chosen.includes(v) ? chosen.filter(x => x !== v) : [...chosen, v]; paint(); if (onChange) onChange(); }
  function open() { pop.hidden = false; btn.setAttribute("aria-expanded", "true"); openPickers.add(self); query = ""; search.value = ""; active = 0; paint(); search.focus(); }
  function close() { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); openPickers.delete(self); }
  btn.addEventListener("click", () => (pop.hidden ? open() : close()));
  search.addEventListener("input", () => { query = search.value.trim().toLowerCase(); active = 0; paint(); });
  search.addEventListener("keydown", ev => {
    const rows = visible();
    if (ev.key === "ArrowDown") { ev.preventDefault(); active = Math.min(rows.length - 1, active + 1); paint(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); active = Math.max(0, active - 1); paint(); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (rows[active]) toggle(rows[active]); }
    else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); close(); btn.focus(); }
    const el = $(".ms-opt.active", list); if (el) el.scrollIntoView({ block: "nearest" });
  });
  list.addEventListener("mousedown", ev => ev.preventDefault());
  list.addEventListener("click", ev => { const o = ev.target.closest(".ms-opt"); if (o) toggle(o.dataset.v); });
  $(".ms-clear", root).addEventListener("click", () => { chosen = []; paint(); if (onChange) onChange(); });
  $(".ms-done", root).addEventListener("click", () => { close(); btn.focus(); });
  chips.addEventListener("click", ev => { const b = ev.target.closest("[data-remove]"); if (b) toggle(b.dataset.remove); });
  function set(values) { chosen = values.filter(v => options.includes(v)); paint(); }
  set(selected);
  return { get: () => chosen.slice(), set };
}

function makePincodeInput(root, selected, onChange) {
  let chosen = [];
  root.innerHTML = `<div class="tag-input"><input type="text" inputmode="numeric" autocomplete="off" placeholder="Type a pincode, press Enter" aria-label="Add a pincode"></div><div class="hint pin-msg" style="display:none"></div>`;
  const box = $(".tag-input", root), input = $("input", root), msg = $(".pin-msg", root);
  function paint() {
    $$(".x-chip", box).forEach(c => c.remove());
    for (const v of chosen) {
      const chip = document.createElement("span");
      chip.className = "x-chip";
      chip.innerHTML = `${esc(v)}<button type="button" title="Remove" aria-label="Remove ${esc(v)}">&times;</button>`;
      $("button", chip).addEventListener("click", ev => { ev.stopPropagation(); chosen = chosen.filter(x => x !== v); paint(); if (onChange) onChange(); });
      box.insertBefore(chip, input);
    }
  }
  const say = t => { msg.textContent = t; msg.style.display = t ? "" : "none"; };
  function commit() {
    const tokens = input.value.split(/[\s,;]+/).filter(Boolean), bad = [];
    let added = false;
    for (const t of tokens) { if (!/^\d{6}$/.test(t)) bad.push(t); else if (!chosen.includes(t)) { chosen.push(t); added = true; } }
    input.value = bad.join(" ");
    say(bad.length ? `${bad.map(b => `"${b}"`).join(", ")} ${bad.length === 1 ? "isn't" : "aren't"} a 6-digit pincode.` : "");
    if (added) { paint(); if (onChange) onChange(); }
  }
  input.addEventListener("input", () => { input.value = input.value.replace(/[^\d,;\s]/g, ""); say(""); });
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === ",") { ev.preventDefault(); commit(); }
    else if (ev.key === "Backspace" && !input.value && chosen.length) { chosen.pop(); paint(); if (onChange) onChange(); }
  });
  box.addEventListener("click", () => input.focus());
  chosen = [...new Set(selected)]; paint();
  return { get() { commit(); return chosen.slice(); }, pending: () => input.value.trim(), set(v) { chosen = [...new Set(v)]; input.value = ""; say(""); paint(); } };
}

// The four selections together -> { read, count, problem, over, set }
function makeAxes(els, initial, onChange) {
  const changed = () => { paintSummary(); if (onChange) onChange(); };
  const l1 = makeToggleGroup(els.l1, meta.l1_options, initial.l1s, changed);
  const l2 = makeToggleGroup(els.l2, meta.l2_options, initial.l2s, changed);
  const state = makeStatePicker(els.state, meta.state_options, initial.states, changed, meta.default_state);
  const pin = makePincodeInput(els.pincode, initial.pincodes, changed);
  const read = () => { const s = state.get(), p = pin.get(); return { l1s: l1.get(), l2s: l2.get(), states: s.length ? s : [meta.default_state], pincodes: p.length ? p : [meta.default_pincode] }; };
  const count = () => { const v = read(); return v.l1s.length * v.l2s.length * v.states.length * v.pincodes.length; };
  function paintSummary() {
    const v = read(), n = count(), over = n > meta.max_combos;
    els.summary.className = "combo-hint" + (over ? " over" : "");
    els.summary.textContent = n === 1 ? "" :
      `${v.l1s.length} l1 × ${v.l2s.length} l2 × ${plural(v.states.length, "state")} × ${plural(v.pincodes.length, "pincode")} = ${n} checks` +
      (over ? ` — over the limit of ${meta.max_combos}, please narrow it down` : ", run one after another");
  }
  const problem = () => { pin.get(); const p = pin.pending(); return p ? `"${p}" in the pincode box isn't a 6-digit pincode — fix or clear it first.` : ""; };
  paintSummary();
  return { read, count, problem, over: () => count() > meta.max_combos, set(v) { l1.set(v.l1s); l2.set(v.l2s); state.set(v.states); pin.set(v.pincodes); paintSummary(); } };
}

// Carousel checklist: every carousel of a feed, checked = included. Returns { excluded(), load(), setExcluded() }.
function makeCarouselPicker(root, getFeed, initialExcluded) {
  let excluded = new Map(initialExcluded || []);   // section id -> label
  let loaded = null;
  function paint() {
    const inFeed = new Set((loaded || []).map(c => c.id));
    let html = "";
    if (loaded) {
      html += `<div class="car-list">${loaded.map(c => `<label class="car-row"><input type="checkbox" data-sec="${esc(c.id)}" ${excluded.has(c.id) ? "" : "checked"}>
        ${c.image ? `<img src="${esc(c.image)}" loading="lazy" alt="">` : ""}<span>${esc(c.label)}</span><span class="n">${plural(c.count, "banner")}</span></label>`).join("")}</div>
        <div class="hint">Ticked carousels are checked; untick one to leave it out.</div>`;
    }
    const stale = [...excluded].filter(([id]) => !inFeed.has(id));
    if (stale.length) html += `<div class="hint">${loaded ? "Left out, but not in the current feed:" : "Currently left out:"}</div><div class="chip-list">${stale.map(([id, label]) =>
      `<span class="x-chip">${esc(label || id.slice(0, 10) + "…")}<button type="button" data-remove="${esc(id)}" title="Stop leaving this one out">&times;</button></span>`).join("")}</div>`;
    else if (!loaded) html += `<div class="hint">Every carousel in scope is checked. Load them to leave some out.</div>`;
    $(".cp-body", root).innerHTML = html;
    $$("[data-sec]", root).forEach(cb => cb.addEventListener("change", () => {
      const c = loaded.find(x => x.id === cb.dataset.sec);
      if (cb.checked) excluded.delete(c.id); else excluded.set(c.id, c.label);
    }));

function parseRoute() {
  const [a, b, c] = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  if (!a) return { name: "overview" };
  if (a === "runs") return b ? { name: "run", id: b } : { name: "runs" };
  if (a === "schedules") {
    if (!b) return { name: "schedules" };
    if (b === "new") return { name: "sched-form" };
    if (c === "edit") return { name: "sched-form", id: Number(b) };

}

function latestPerFeed() {
  const seen = new Map();
  for (const r of runs) {
    if (r.status !== "done") continue;
    const key = [r.l1, r.l2, r.state, r.pincode, r.scope].join("|");
    if (!seen.has(key)) seen.set(key, r);
  }

}
function ring(pct, tone) {

  return `<div class="ring"><svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="${R}"/><circle class="arc" cx="66" cy="66" r="${R}" stroke="var(--${tone})" stroke-dasharray="${dash.toFixed(1)} ${C.toFixed(1)}"/></svg>
    <div class="mid"><b>${Math.round(pct)}%</b><span>passing</span></div></div>`;
}

async function fetchBanners(run) {
  if (run.status === "done" && bannerCache.has(run.run_id)) return bannerCache.get(run.run_id);
  const rows = (await api(`/api/runs/${run.run_id}/banners`)).map(b => ({ ...b, _run: run.run_id }));
  if (run.status === "done") bannerCache.set(run.run_id, rows);
  return rows;
}

function bannerCardHtml(b) {

async function retryBanner(id, btn) {
  const runId = R.id, startAttempts = (R.banners.get(id) || {}).attempts || 0;
  btn.disabled = true; btn.textContent = "Retrying…";
  try { await api(`/api/runs/${runId}/banners/${encodeURIComponent(id)}/retry`, { method: "POST" }); }
  catch (e) { btn.disabled = false; btn.textContent = "Retry"; toast("Couldn't retry: " + errText(e), true); return; }
  R.banners.set(id, { ...(R.banners.get(id) || {}), result: "PROCESSING", reason: "", try_number: startAttempts + 1, retries_exhausted: false }); paintRun();

  catch (e) { btn.disabled = false; toast(`Couldn't ${cur ? "unskip" : "skip"}: ${errText(e)}`, true); }

const NOTIFY_LABEL = { off: "Never", new_fails: "When a banner newly fails", any_change: "On any change" };
function schedHealth(s) {
  const r = s.latest_run;
  if (!s.enabled) return "pend";
  if (["failed", "error"].includes(s.last_status)) return "fail";
  if (r && r.status === "running") return "proc";
  if (r && r.status === "done") return runHealth(r);
  return "pend";
}
const needsAttention = s => s.unread_alerts > 0 || ["failed", "error", "skipped"].includes(s.last_status);
let schedFilter = "all";

async function schedAction(act, s) {
  try {
    if (act === "toggle") { await api(`/api/schedules/${s.id}`, { method: "PATCH", headers: JSON_HEADERS, body: JSON.stringify({ enabled: !s.enabled }) }); toast(s.enabled ? `“${s.name}” paused.` : `“${s.name}” is on.`); renderRoute(); }
    else if (act === "run") {
      const { run_id, combos, queued } = await api(`/api/schedules/${s.id}/run-now`, { method: "POST" });
      if (queued) toast(`Started check 1 of ${combos} for “${s.name}”. The rest follow one after another.`);
      location.hash = `#/runs/${run_id}`;
    } else if (act === "delete") {
      if (!await confirmDialog({ title: `Delete “${s.name}”?`, text: "Its past checks and alerts are kept.", ok: "Delete", danger: true })) return;
      await api(`/api/schedules/${s.id}`, { method: "DELETE" });
      if (parseRoute().name === "sched") location.hash = "#/schedules"; else renderRoute();
    }
  } catch (e) { toast(`Couldn't ${act === "run" ? "start the check" : act}: ${errText(e)}`, true); }
}
const tagList = (vals, max = 4) => vals.slice(0, max).map(v => `<span class="tag">${esc(v)}</span>`).join("") + (vals.length > max ? `<span class="tag">+${vals.length - max}</span>` : "");

function schedCard(s) {

function wireSchedCards(root) {
  $$(".scard", root).forEach(card => {
    const s = scheds.find(x => x.id === Number(card.dataset.id));
    card.addEventListener("click", ev => { if (ev.target.closest("[data-act], a")) return; location.hash = `#/schedules/${s.id}`; });
    card.addEventListener("keydown", ev => { if (ev.target === card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); location.hash = `#/schedules/${s.id}`; } });
    $$("[data-act]", card).forEach(b => b.addEventListener("click", ev => { ev.stopPropagation(); schedAction(b.dataset.act, s); }));
  });
}

function groupRuns(list) {
  const groups = [], by = new Map();
  for (const r of list) { const k = r.batch_id || r.run_id; if (!by.has(k)) { const g = { key: k, runs: [] }; by.set(k, g); groups.push(g); } by.get(k).runs.push(r); }
  for (const g of groups) g.runs.sort((a, b) => (a.started_at < b.started_at ? -1 : 1));
  return groups;
}
function runTile(r) {
  const t = totalOf(r.counts), took = r.finished_at ? fmtDuration(Math.max(0, Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 1000))) : "";
  return `<div class="card rtile" data-open="${esc(r.run_id)}" tabindex="0" role="link"><div class="h"><span class="grow">${feedLabel(r)}</span>${runPill(r.status)}</div>
    <div class="cell-sub">${placeLabel(r)}</div>${segBar(r.counts)}
    <div class="lab dim" style="font-size:12.5px">${runLine(r)} <span class="muted">· ${plural(t, "banner")}${took ? ` · ${esc(took)}` : ""}</span></div>
    ${r.diff ? `<div style="font-size:12.5px;${!r.diff.baseline && r.diff.counts.newly_failing ? "color:var(--fail-ink);font-weight:600" : "color:var(--ink-3)"}">${esc(r.diff.summary)}</div>` : ""}</div>`;
}
function alertRow(a, withRun = true) {
  return `<div class="alert ${a.kind === "test" ? "test" : ""} ${a.is_read ? "read" : ""}"><div class="ico">${ico(a.kind === "test" ? "info" : "alert")}</div>
    <div><div class="t">${a.is_read ? "" : '<span class="unread-dot"></span>'}${esc(a.title)}</div>
      <div class="meta">${esc(fmtWhen(a.created_at))}${a.delivery ? ` · Windows notification: ${esc(a.delivery)}` : ""}</div>
      ${a.message ? `<pre>${esc(a.message)}</pre>` : ""}
      <div class="row-acts">${withRun && a.run_id ? `<button class="btn sm" data-open-run="${esc(a.run_id)}">Open check</button>` : ""}${a.is_read ? "" : `<button class="btn sm" data-read="${a.id}">Mark read</button>`}</div></div>
    <button class="icon-btn" data-del-alert="${a.id}" title="Remove this alert" aria-label="Remove this alert">${ico("x", "sm")}</button></div>`;
}
function wireAlerts(root, reload) {
  $$("[data-open-run]", root).forEach(b => b.addEventListener("click", () => { location.hash = `#/runs/${b.dataset.openRun}`; }));
  $$("[data-del-alert]", root).forEach(b => b.addEventListener("click", async () => { try { await api(`/api/alerts/${b.dataset.delAlert}`, { method: "DELETE" }); reload(); } catch (e) { toast(errText(e), true); } }));
  $$("[data-read]", root).forEach(b => b.addEventListener("click", async () => { try { await api(`/api/alerts/${b.dataset.read}/read`, { method: "POST" }); reload(); } catch (e) { toast(errText(e), true); } }));
}

let detailOpen = { settings: false, alerts: false };
async function viewSched(route, view, stale) {
  const [s, rs] = await Promise.all([api(`/api/schedules/${route.id}`), api(`/api/runs?schedule_id=${route.id}&limit=120`), refreshCore()]);
  if (stale()) return;

  const rows = [

    ${pageHead({ crumbs: [{ label: "Schedules", href: "#/schedules" }, { label: s.name }], title: esc(s.name),
      sub: `${s.enabled ? `Every ${esc(fmtInterval(s.interval_minutes))} · next check ${esc(inTime(s.next_run_at) || "—")}` : "Paused — it won't run on its own"}${s.last_status ? ` · last result: ${esc(s.last_message || s.last_status)}` : ""}`,
      actions: `<button class="btn primary" data-act="run">${ico("play", "sm")} Run now</button><button class="btn" data-act="toggle">${ico(s.enabled ? "pause" : "play", "sm")} ${s.enabled ? "Pause" : "Resume"}</button>
        <a class="btn" href="#/schedules/${s.id}/edit">${ico("edit", "sm")} Edit</a><button class="btn danger" data-act="delete">${ico("trash", "sm")}</button>` })}
    <div class="section-title">Checks so far (${rs.length})</div>
    ${rs.length ? groups.map(g => {
      if (g.runs.length === 1) return `<div class="run-tiles" style="margin-bottom:14px">${runTile(g.runs[0])}</div>`;
      const tot = {}; for (const r of g.runs) for (const [k, v] of Object.entries(r.counts || {})) tot[k] = (tot[k] || 0) + v;
      const going = g.runs.filter(r => r.status === "running").length;
      return `<div class="fire"><b>${esc(fmtWhen(g.runs[0].started_at))}</b><span class="dim">${plural(g.runs.length, "check")}${going ? `, ${going} still going` : ""} · ${runLine({ counts: tot, status: "done" })}</span><span class="line"></span></div>
        <div class="run-tiles">${g.runs.map(runTile).join("")}</div>`; }).join("")
      : `<div class="empty"><div class="big">Hasn't run yet</div>It will at its next check time, or start one now.</div>`}
    <details class="fold" data-key="settings" ${detailOpen.settings ? "open" : ""}><summary>Settings</summary><div class="fold-body"><dl class="facts" style="gap:10px 20px">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div></details>
    <details class="fold" data-key="alerts" ${detailOpen.alerts ? "open" : ""}><summary>Alerts (${s.alerts.length}${s.unread_alerts ? `, ${s.unread_alerts} unread` : ""})</summary>
      <div class="fold-body" style="padding:0">${s.alerts.length ? `<div style="padding:0 20px 8px"><button class="btn sm danger" id="sd-clear">Clear these</button></div>${s.alerts.map(a => alertRow(a)).join("")}` : `<div class="empty flat">No alerts from this schedule.</div>`}</div></details>`;
  $$("[data-act]", view).forEach(b => b.addEventListener("click", () => schedAction(b.dataset.act, s)));

  $$("details.fold", view).forEach(d => d.addEventListener("toggle", () => { detailOpen[d.dataset.key] = d.open; }));

  if (byId("sd-clear")) byId("sd-clear").onclick = async () => {

    try { await api(`/api/alerts?schedule_id=${s.id}`, { method: "DELETE" }); renderRoute(); } catch (e) { toast(errText(e), true); }

          <input class="input" type="text" id="sf-hh" inputmode="numeric" maxlength="2" placeholder="hh" aria-label="Hour"><b>:</b><input class="input" type="text" id="sf-mm" inputmode="numeric" maxlength="2" placeholder="mm" aria-label="Minutes">
          <select class="sel" id="sf-ampm" aria-label="AM or PM"><option>AM</option><option>PM</option></select><button type="button" class="btn sm" id="sf-now">Now</button></div>

        <div class="two"><div class="field"><label class="lb">State</label><div id="sf-state"></div></div><div class="field"><label class="lb">Pincode</label><div id="sf-pin"></div></div></div>

        <div class="field"><label class="lb">Carousels to leave out</label><div id="sf-cars"></div></div>`)}

          <div class="hint">“When a banner newly fails” means it fails now and didn't in this schedule's previous check. “On any change” also covers new inconclusives, recoveries, and banners appearing or leaving. The first check only sets the baseline.</div></div>
        <label class="checkline"><input type="checkbox" id="sf-toast"><div><b>Also show a Windows notification</b><span>Pops up on this PC even when this page is closed.</span></div></label>`)}

    el.textContent = `First check: ${fmtWhen(new Date(first).toISOString())}` + (start > now ? "" : ` — the start time has passed, so this is the next slot, counting every ${fmtInterval(every)} from the start.`);

    if (!(every >= 1)) return toast("Enter how often it should run (1 or more).", true);
    const start = readStart(); if (start.error) return toast(start.error, true);
    const problem = axes.problem(); if (problem) return toast(problem, true);
    if (axes.over()) return toast(`That's ${axes.count()} checks each time; the limit is ${meta.max_combos}. Please narrow it down.`, true);
    const limit = byId("sf-limit").value;
    const body = { name: byId("sf-name").value.trim() || "Unnamed schedule", interval_minutes: every * parseInt(byId("sf-unit").value, 10), start_at: start.date.toISOString(),
      ...axes.read(), scope: byId("sf-scope").value, banner_limit: limit ? parseInt(limit, 10) : null,

      notify_mode: byId("sf-notify").value, notify_toast: byId("sf-toast").checked, excluded_sections: cars.excluded() };
    const btn = ev.currentTarget; btn.disabled = true;
    try {
      const saved = await api(s ? `/api/schedules/${s.id}` : "/api/schedules", { method: s ? "PATCH" : "POST", headers: JSON_HEADERS, body: JSON.stringify(body) });
      toast(s ? "Schedule saved." : "Schedule created."); location.hash = `#/schedules/${saved.id}`;
    } catch (e) { btn.disabled = false; toast("Couldn't save the schedule: " + errText(e), true); }
  };
}

  wireAlerts(view, reload);
  byId("al-read").onclick = async () => { try { await api("/api/alerts/read-all", { method: "POST" }); reload(); } catch (e) { toast(errText(e), true); } };
  byId("al-clear").onclick = async () => {
    if (!await confirmDialog({ title: "Clear every alert?", text: "This removes the alerts of every schedule and can't be undone.", ok: "Clear all", danger: true })) return;
    try { await api("/api/alerts", { method: "DELETE" }); reload(); } catch (e) { toast(errText(e), true); }
  };
  byId("al-test").onclick = async () => {
    try { const r = await api("/api/notify/test", { method: "POST" }); toast(r.delivery === "ok" ? "Test sent — you should see a Windows notification now." : `Recorded in the app, but the Windows notification didn't show: ${r.delivery}`, r.delivery !== "ok"); reload(); }
    catch (e) { toast(errText(e), true); }
  };
}

const VIEWS = { overview: viewOverview, runs: viewRuns, run: viewRun, schedules: viewSchedules, sched: viewSched, "sched-form": viewSchedForm, alerts: viewAlerts };

// ============================================================================================
// Boot
// ============================================================================================
(async function boot() {
  paintIcons();
  try { meta = await api("/api/meta"); }
  catch (e) { byId("view").innerHTML = `<div class="empty"><div class="big">Can't reach the server</div>${esc(errText(e))}</div>`; return; }
  renderRoute();
  setInterval(() => { refreshCore().catch(() => {}); }, 30000);
})();
</script>
</body>
</html>
