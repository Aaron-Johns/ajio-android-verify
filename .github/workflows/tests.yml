name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # the project is developed and used on Windows, so the tests run there too
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # the tests use fakes: no network, no .env, no secrets
      - run: python -m pytest tests -q
